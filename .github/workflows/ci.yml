name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

  lint:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 检查 JS 语法
        run: |
          for f in js/*.js; do
            echo "检查 $f"
            node --check "$f"
          done
      - name: 检查未定义函数
        run: node scripts/check-undefined.js

      - name: 检查资源引用
        run: node scripts/check-refs.js

      - name: 检查关键文件存在
        run: |
          test -f index.html
          test -f sw.js
          test -f manifest.webmanifest
          test -f js/core.js
          echo "结构完整"


