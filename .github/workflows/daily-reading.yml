name: 每日阅读更新

on:
  schedule:
    - cron: "20 22 * * *"   # UTC 22:20 = 北京时间 06:20
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install edge-tts

      - name: 抓取 + 翻译 + 生成音频
        env:
          SILICONFLOW_KEY: ${{ secrets.SILICONFLOW_KEY }}
          AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}
          AZURE_TTS_REGION: ${{ secrets.AZURE_TTS_REGION }}
        run: python scripts/daily_reading.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reading.json data/reading/audio
          if git diff --staged --quiet; then
            echo "没有新内容"
          else
            git commit -m "chore: 更新每日阅读"
            git push
          fi
