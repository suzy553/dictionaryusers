<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>声音自检</title>
<style>
  body{margin:0;padding:20px 16px;font-family:-apple-system,"PingFang SC",sans-serif;
       background:#0f141a;color:#e6edf3;font-size:15px;line-height:1.7}
  h1{font-size:18px;margin:0 0 14px}
  .row{background:#171f28;border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .k{font-size:12px;color:#8b98a6}
  .v{font-size:15px;font-weight:700;margin-top:2px}
  .ok{color:#3fb950}.bad{color:#f85149}.warn{color:#f0a020}
  button{
    width:100%;height:52px;margin:8px 0;border:none;border-radius:14px;
    font-size:16px;font-weight:800;background:#2f81f7;color:#fff;
  }
  button:active{transform:scale(.98)}
  button.g{background:#58cc02}
  #log{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#8b98a6;
       white-space:pre-wrap;background:#0b0f14;border-radius:10px;padding:10px;margin-top:10px;min-height:80px}
</style>
</head>
<body>
<h1>🔊 声音自检</h1>

<div class="row"><div class="k">1. 浏览器支持语音合成</div><div class="v" id="r1">检测中…</div></div>
<div class="row"><div class="k">2. 可用语音数量</div><div class="v" id="r2">检测中…</div></div>
<div class="row"><div class="k">3. 是否有英文语音</div><div class="v" id="r3">检测中…</div></div>
<div class="row"><div class="k">4. 音频上下文状态</div><div class="v" id="r4">未测试</div></div>

<button class="g" id="b1">▶ 测试 1：播放一声「嘟」</button>
<button id="b2">▶ 测试 2：朗读单词 "apple"</button>

<div id="log">点上面的按钮，看这里输出…</div>

<script>
var logEl = document.getElementById('log');
function log(s){ logEl.textContent += s + '\n'; }

/* 1-3：能力检测 */
var synth = window.speechSynthesis;
document.getElementById('r1').innerHTML = synth
  ? '<span class="ok">支持</span>'
  : '<span class="bad">不支持（浏览器禁用了语音合成）</span>';

var voices = [];
function refresh(){
  voices = synth ? (synth.getVoices() || []) : [];
  document.getElementById('r2').innerHTML = voices.length + ' 个';
  var en = voices.filter(function(v){ return /en/i.test(v.lang); });
  document.getElementById('r3').innerHTML = en.length
    ? '<span class="ok">有 ' + en.length + ' 个英文语音</span>（如 ' + en[0].name + '）'
    : '<span class="bad">没有英文语音</span>';
}
refresh();
if (synth) synth.onvoiceschanged = refresh;
setTimeout(refresh, 800);

/* 4a：WebAudio 嘟声 —— 测试设备音频通道 */
document.getElementById('b1').onclick = function(){
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    var ctx = new AC();
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.4);
    document.getElementById('r4').innerHTML = '<span class="ok">' + ctx.state + '</span>';
    log('嘟嘟已播放。听到没有？');
  } catch (e) {
    document.getElementById('r4').innerHTML = '<span class="bad">创建失败</span>';
    log('AudioContext 失败：' + e.message);
  }
};

/* 4b：语音朗读 */
document.getElementById('b2').onclick = function(){
  if (!synth) { log('不支持语音合成'); return; }
  try {
    synth.cancel();
    var u = new SpeechSynthesisUtterance('apple');
    u.lang = 'en-US';
    u.rate = 0.9;
    u.volume = 1;
    var en = voices.filter(function(v){ return /en-US/i.test(v.lang); })[0]
          || voices.filter(function(v){ return /en/i.test(v.lang); })[0];
    if (en) { u.voice = en; log('使用语音：' + en.name); }
    u.onstart = function(){ log('语音开始播放'); };
    u.onend   = function(){ log('语音播放结束'); };
    u.onerror = function(e){ log('语音出错：' + (e.error || e.name || 'unknown')); };
    synth.speak(u);
    log('已调用 speak("apple")，等 2 秒看有没有声...');
    setTimeout(function(){
      log('状态：speaking=' + synth.speaking + ' pending=' + synth.pending + ' paused=' + synth.paused);
    }, 1500);
  } catch (e) {
    log('speak 异常：' + e.message);
  }
};

log('UA：' + navigator.userAgent.slice(0, 90));
</script>
</body>
</html>
