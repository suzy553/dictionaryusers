<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Century Gothic","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:#E9E7E2;padding:18px;display:grid;grid-template-columns:380px 380px;gap:18px;justify-content:center;
  }
  .panel{width:380px}
  .lbl{font-size:13px;font-weight:800;color:#33322E;letter-spacing:.3px;margin:0 0 9px 2px}
  .lbl small{font-weight:500;color:#8B8880;margin-left:6px;letter-spacing:0}
  .art{width:380px;height:300px;border-radius:18px;overflow:hidden;display:block;
       box-shadow:0 6px 20px rgba(60,55,45,.12)}
</style>
</head>
<body>

<!-- 1 氛围剪影 -->
<div class="panel">
  <div class="lbl">1 · 氛围剪影 <small>Alto's Odyssey · 大色块 + 多层山脊</small></div>
  <svg class="art" viewBox="0 0 380 300" preserveAspectRatio="none">
    <defs>
      <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#F7D3AE"/>
        <stop offset="42%" stop-color="#E39C7C"/>
        <stop offset="100%" stop-color="#6E5470"/>
      </linearGradient>
      <radialGradient id="sun1" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFF3D9"/><stop offset="100%" stop-color="#FFE0B0"/>
      </radialGradient>
    </defs>
    <rect width="380" height="300" fill="url(#sky1)"/>
    <circle cx="292" cy="92" r="40" fill="url(#sun1)" opacity=".95"/>
    <circle cx="292" cy="92" r="62" fill="#FFD9A8" opacity=".13"/>
    <path d="M0 172 Q62 146 124 170 Q188 142 250 168 Q310 146 380 170 V300 H0 Z" fill="#8B7080" opacity=".88"/>
    <path d="M0 198 Q82 172 164 196 Q246 170 328 194 Q356 188 380 196 V300 H0 Z" fill="#5B4960"/>
    <path d="M0 228 Q92 206 184 226 Q276 204 380 224 V300 H0 Z" fill="#372E42"/>
    <g fill="#221C2C">
      <path d="M262 214 l46 -36 46 36 z"/>
      <rect x="272" y="212" width="72" height="54" rx="3"/>
      <rect x="298" y="238" width="20" height="28" rx="2" fill="#2E2438"/>
      <rect x="58" y="218" width="9" height="40"/>
      <circle cx="62" cy="204" r="27"/>
      <circle cx="86" cy="214" r="18"/>
    </g>
    <rect x="322" y="222" width="14" height="12" fill="#FFC978" opacity=".9"/>
    <g fill="#1B1626">
      <g transform="translate(158,206)">
        <circle cx="0" cy="0" r="12.5"/>
        <path d="M-17 13 q17 -7 34 0 q7 17 7 31 h-48 q0 -14 7 -31 z"/>
        <path d="M-28 44 q28 -9 56 0 l-5 9 h-46 z"/>
        <path d="M-21 30 l21 -7 21 7 -21 9 z"/>
      </g>
      <g transform="translate(232,236)">
        <ellipse cx="0" cy="0" rx="13" ry="12"/>
        <ellipse cx="-4" cy="-14" rx="7" ry="6"/>
      </g>
    </g>
    <path d="M-21 30 l21 -7 21 7 -21 9 z" fill="#4A3B55" transform="translate(158,206)"/>
  </svg>
</div>

<!-- 2 线描 -->
<div class="panel">
  <div class="lbl">2 · 纸质剪纸 <small>Paper Cutout · 分层纸片 + 柔和投影 + 纸纹</small></div>
  <svg class="art" viewBox="0 0 380 300" preserveAspectRatio="none">
    <defs>
      <filter id="pcShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="3.4" flood-color="#5A4A32" flood-opacity=".18"/>
      </filter>
      <filter id="pcShadowSoft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#5A4A32" flood-opacity=".13"/>
      </filter>
      <filter id="paper">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
        <feComponentTransfer><feFuncA type="linear" slope=".04"/></feComponentTransfer>
      </filter>
    </defs>
    <rect width="380" height="300" fill="#EAE2D4"/>
    <circle cx="300" cy="74" r="30" fill="#E9C58C" filter="url(#pcShadowSoft)"/>
    <g filter="url(#pcShadowSoft)">
      <rect x="52" y="58" width="76" height="16" rx="8" fill="#F6EFE2"/>
      <rect x="88" y="42" width="44" height="16" rx="8" fill="#F6EFE2"/>
    </g>
    <path d="M0 178 Q70 150 140 172 Q210 146 280 170 Q332 158 380 170 V300 H0 Z"
          fill="#C3CDB2" filter="url(#pcShadow)"/>
    <path d="M0 214 Q100 192 200 210 Q300 190 380 208 V300 H0 Z"
          fill="#A3B18F" filter="url(#pcShadow)"/>
    <!-- 房子 -->
    <g filter="url(#pcShadow)">
      <path d="M262 218 L308 176 L354 218 Z" fill="#BE7A5B"/>
      <rect x="266" y="216" width="84" height="50" fill="#F8F0E1"/>
      <rect x="296" y="238" width="20" height="28" fill="#8B6B51"/>
      <rect x="326" y="228" width="16" height="13" fill="#E9C170"/>
    </g>
    <!-- 树 -->
    <g filter="url(#pcShadow)">
      <rect x="58" y="212" width="9" height="44" fill="#8B6F55"/>
      <circle cx="62" cy="200" r="27" fill="#7F9070"/>
      <circle cx="86" cy="214" r="17" fill="#93A484"/>
    </g>
    <!-- 人 -->
    <g filter="url(#pcShadow)">
      <g transform="translate(158,206)">
        <circle cx="0" cy="0" r="12" fill="#D9B99C"/>
        <path d="M-12 -3 q12 -13 24 0 q0 -17 -12 -17 q-12 0 -12 17 z" fill="#4A4238"/>
        <path d="M-16 12 q16 -6 32 0 q6 16 6 32 h-44 q0 -16 6 -32" fill="#6F7F8C"/>
        <path d="M-27 44 q27 -9 54 0 l-5 8 h-44 z" fill="#5C6B77"/>
        <path d="M-21 30 l21 -7 21 7 -21 9 z" fill="#FBF6EA"/>
      </g>
    </g>
    <!-- 小生物 -->
    <g transform="translate(236,238)" filter="url(#pcShadow)">
      <ellipse cx="0" cy="0" rx="13" ry="11.5" fill="#C9BCA1"/>
      <ellipse cx="0" cy="3" rx="8" ry="6" fill="#F3ECDF"/>
      <circle cx="-4" cy="-2" r="2.8" fill="#3A3630"/><circle cx="4" cy="-2" r="2.8" fill="#3A3630"/>
      <path d="M0 2 l2 1.6 -2 1.8 -2 -1.8z" fill="#C9945E"/>
      <path d="M-3 -11 l-5 -5 8 2 z" fill="#7F9070"/><path d="M3 -11 l5 -5 -8 2 z" fill="#7F9070"/>
    </g>
    <rect width="380" height="300" filter="url(#paper)" opacity=".55"/>
  </svg>
</div>

<!-- 3 几何平面 -->
<div class="panel">
  <div class="lbl">3 · 几何平面 <small>海报风 · 无描边 + 克制色块</small></div>
  <svg class="art" viewBox="0 0 380 300" preserveAspectRatio="none">
    <rect width="380" height="300" fill="#EFE9DC"/>
    <path d="M0 0 H380 V168 H0 Z" fill="#DCE4E6"/>
    <circle cx="300" cy="72" r="30" fill="#E7D3B4"/>
    <rect x="60" y="62" width="72" height="14" rx="7" fill="#EFEFEA" opacity=".85"/>
    <rect x="92" y="46" width="42" height="14" rx="7" fill="#EFEFEA" opacity=".85"/>
    <rect x="196" y="96" width="58" height="12" rx="6" fill="#EFEFEA" opacity=".7"/>
    <path d="M0 168 Q70 142 140 164 Q210 140 280 162 Q330 150 380 162 V300 H0 Z" fill="#C6B79E"/>
    <path d="M0 206 Q95 184 190 202 Q285 182 380 200 V300 H0 Z" fill="#A3B08F"/>
    <path d="M0 246 Q100 228 200 244 Q300 226 380 242 V300 H0 Z" fill="#8C9A7C"/>
    <!-- 房子 -->
    <path d="M262 216 L308 176 L354 216 Z" fill="#C1795A"/>
    <rect x="266" y="214" width="84" height="48" fill="#F2EADC"/>
    <rect x="296" y="236" width="20" height="26" fill="#7A6E5E"/>
    <rect x="326" y="226" width="16" height="12" fill="#E9C87F"/>
    <!-- 树 -->
    <rect x="58" y="212" width="8" height="42" fill="#8B6F55"/>
    <circle cx="62" cy="200" r="26" fill="#8C9A7C"/>
    <circle cx="84" cy="212" r="16" fill="#9DAB8C"/>
    <!-- 人 -->
    <g transform="translate(158,206)">
      <circle cx="0" cy="0" r="12" fill="#D7B69A"/>
      <path d="M-12 -3 q12 -12 24 0 q0 -16 -12 -16 q-12 0 -12 16 z" fill="#3A3730"/>
      <path d="M-16 12 q16 -6 32 0 q6 16 6 30 h-44 q0 -14 6 -30" fill="#6E7F8C"/>
      <path d="M-27 44 q27 -9 54 0 l-5 8 h-44 z" fill="#5B6974"/>
      <path d="M-21 30 l21 -7 21 7 -21 9 z" fill="#F7F2E7"/>
      <path d="M0 23 v14" stroke="#CFC6B4" stroke-width="1.4"/>
    </g>
    <!-- 小生物 -->
    <g transform="translate(236,238)">
      <ellipse cx="0" cy="0" rx="13" ry="11.5" fill="#C4B79C"/>
      <ellipse cx="0" cy="3" rx="8" ry="6" fill="#F1EADD"/>
      <circle cx="-4" cy="-2" r="3" fill="#3A3630"/><circle cx="4" cy="-2" r="3" fill="#3A3630"/>
      <path d="M0 2 l2 1.6 -2 1.8 -2 -1.8z" fill="#C9945E"/>
      <path d="M-3 -11 l-5 -5 8 2 z" fill="#A3B08F"/><path d="M3 -11 l5 -5 -8 2 z" fill="#A3B08F"/>
    </g>
  </svg>
</div>

<!-- 4 水彩 -->
<div class="panel">
  <div class="lbl">4 · 淡彩水彩 <small>纸感 + 晕染 · 柔边低对比</small></div>
  <svg class="art" viewBox="0 0 380 300" preserveAspectRatio="none">
    <defs>
      <filter id="wcBlur"><feGaussianBlur stdDeviation="3.2"/></filter>
      <filter id="wcSoft"><feGaussianBlur stdDeviation=".7"/></filter>
      <filter id="grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
        <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
      </filter>
      <linearGradient id="wsky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#EDE4D6"/><stop offset="100%" stop-color="#D8DFE3"/>
      </linearGradient>
    </defs>
    <rect width="380" height="300" fill="url(#wsky)"/>
    <g filter="url(#wcBlur)" opacity=".75">
      <ellipse cx="90" cy="80" rx="86" ry="40" fill="#C9D6D2"/>
      <ellipse cx="300" cy="60" rx="70" ry="34" fill="#E7C9B4"/>
      <ellipse cx="210" cy="108" rx="96" ry="34" fill="#DCD3E0"/>
    </g>
    <circle cx="300" cy="86" r="26" fill="#F0D9B8" opacity=".85" filter="url(#wcSoft)"/>
    <g filter="url(#wcSoft)">
      <path d="M0 176 Q70 154 140 174 Q210 152 280 172 Q332 160 380 172 V300 H0 Z" fill="#BFCDB8" opacity=".85"/>
      <path d="M0 212 Q100 192 200 210 Q300 190 380 208 V300 H0 Z" fill="#9FAF96" opacity=".9"/>
      <path d="M0 248 Q110 230 220 246 Q310 230 380 244 V300 H0 Z" fill="#849575" opacity=".85"/>
    </g>
    <!-- 房子 -->
    <g filter="url(#wcSoft)">
      <path d="M262 218 L308 178 L354 218 Z" fill="#BC7F63" opacity=".92"/>
      <rect x="266" y="216" width="84" height="48" fill="#F3EADC" opacity=".95"/>
      <rect x="296" y="238" width="20" height="26" fill="#8A7A66" opacity=".9"/>
      <rect x="326" y="228" width="16" height="12" fill="#E3BE7A" opacity=".95"/>
    </g>
    <!-- 树 -->
    <g filter="url(#wcSoft)">
      <rect x="59" y="214" width="8" height="42" fill="#8B7159" opacity=".9"/>
      <circle cx="63" cy="202" r="27" fill="#93A484" opacity=".9"/>
      <circle cx="85" cy="214" r="16" fill="#A6B596" opacity=".85"/>
    </g>
    <!-- 人 -->
    <g transform="translate(158,206)" filter="url(#wcSoft)">
      <circle cx="0" cy="0" r="12" fill="#D9BB9F"/>
      <path d="M-12 -3 q12 -13 24 0 q0 -16 -12 -16 q-12 0 -12 16 z" fill="#4A443C" opacity=".9"/>
      <path d="M-16 12 q16 -6 32 0 q6 16 6 30 h-44 q0 -14 6 -30" fill="#7E8E9A" opacity=".92"/>
      <path d="M-27 44 q27 -9 54 0 l-5 8 h-44 z" fill="#6A7883" opacity=".9"/>
      <path d="M-21 30 l21 -7 21 7 -21 9 z" fill="#FBF6EC"/>
      <path d="M0 23 v14" stroke="#D3CABA" stroke-width="1.3"/>
    </g>
    <!-- 小生物 -->
    <g transform="translate(238,238)" filter="url(#wcSoft)">
      <ellipse cx="0" cy="0" rx="13" ry="11.5" fill="#CBBFA4"/>
      <ellipse cx="0" cy="3" rx="8" ry="6" fill="#F3ECDF"/>
      <circle cx="-4" cy="-2" r="3" fill="#3E3A34"/><circle cx="4" cy="-2" r="3" fill="#3E3A34"/>
      <path d="M0 2 l2 1.6 -2 1.8 -2 -1.8z" fill="#C9945E"/>
      <path d="M-3 -11 l-5 -5 8 2 z" fill="#93A484"/><path d="M3 -11 l5 -5 -8 2 z" fill="#93A484"/>
    </g>
    <rect width="380" height="300" filter="url(#grain)" opacity=".5"/>
  </svg>
</div>

</body>
</html>
