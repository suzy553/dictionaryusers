<!doctype html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/cute.css">
<link rel="stylesheet" href="../css/path.css">
<link rel="stylesheet" href="../css/theme.css">
<style>
  html,body{margin:0;padding:0;width:390px;height:844px;overflow:hidden}
  body{background:#fff}
  .bg-scene{position:absolute;inset:0}
</style>
</head>
<body>
<div class="bg-scene" aria-hidden="true">
  <div class="stars"></div>
  <i class="orb"></i>
  <i class="cloud c1"></i>
  <i class="cloud c2"></i>
  <i class="cloud c3"></i>

  <svg class="bg-art" viewBox="0 0 390 844" preserveAspectRatio="xMidYMax slice">
    <defs>
      <linearGradient id="gGrass" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#9ae765"/>
        <stop offset="100%" stop-color="#4aa32a"/>
      </linearGradient>
      <linearGradient id="gGrass2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#b3f07f"/>
        <stop offset="100%" stop-color="#63c433"/>
      </linearGradient>
    </defs>

    <!-- 远山 -->
    <path class="art-far" d="M0 560 Q70 518 140 552 Q210 514 280 548 Q338 522 390 556 L390 844 L0 844 Z" opacity=".6"/>

    <!-- 房子 -->
    <g class="house">
      <rect class="h-wall" x="256" y="470" width="122" height="112" rx="10"/>
      <path class="h-roof" d="M238 478 L317 398 L396 478 Z"/>
      <rect class="h-chimney" x="350" y="416" width="14" height="36" rx="4"/>
      <rect class="h-door" x="278" y="514" width="42" height="68" rx="8"/>
      <rect class="h-win" x="332" y="502" width="30" height="26" rx="6"/>
      <path class="h-win-split" d="M347 502 v26"/>
    </g>

    <!-- 大树 -->
    <g class="tree">
      <rect class="t-trunk" x="60" y="524" width="14" height="62" rx="6"/>
      <circle class="t-leaf" cx="67" cy="502" r="37"/>
      <circle class="t-leaf" cx="40" cy="524" r="25"/>
      <circle class="t-leaf" cx="94" cy="524" r="25"/>
    </g>

    <!-- 小树（右侧边缘） -->
    <g class="tree">
      <rect class="t-trunk" x="368" y="558" width="10" height="42" rx="4"/>
      <circle class="t-leaf" cx="373" cy="544" r="24"/>
    </g>

    <!-- 草地 -->
    <path class="g-grass" d="M0 602 Q100 578 200 596 T390 586 L390 844 L0 844 Z" fill="url(#gGrass)"/>
    <path class="g-grass2" d="M0 694 Q120 670 240 688 T390 678 L390 844 L0 844 Z" fill="url(#gGrass2)"/>

    <!-- 小孩：坐在草坡上看书 -->
    <g class="kid" transform="translate(150,0)">
      <ellipse cx="0" cy="674" rx="50" ry="14" fill="#2f5c3a" opacity=".2"/>
      <g class="kid-body">
        <path class="kid-pants" d="M-34 674 q15 -23 34 -23 q19 0 34 23 Z"/>
        <rect class="kid-shirt" x="-25" y="608" width="50" height="62" rx="23"/>
        <rect class="kid-shirt" x="-33" y="620" width="14" height="38" rx="7" transform="rotate(15 -26 626)"/>
        <rect class="kid-shirt" x="19" y="620" width="14" height="38" rx="7" transform="rotate(-15 26 626)"/>
        <circle class="kid-skin" cx="0" cy="586" r="24"/>
        <path class="kid-hair" d="M-24 583 a24 24 0 0 1 48 0 q-10 -16 -24 -13.5 q-14 -2.5 -24 13.5 Z"/>
        <path d="M-11 591 q4 3.6 9 0" stroke="#3a3340" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M2 591 q4 3.6 9 0" stroke="#3a3340" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <circle cx="-17" cy="597" r="4.2" fill="#f6b4b4" opacity=".75"/>
        <circle cx="17" cy="597" r="4.2" fill="#f6b4b4" opacity=".75"/>
        <g class="kid-book">
          <path d="M-38 634 L-3 626 L-3 660 L-38 668 Z" fill="#ffffff"/>
          <path d="M3 626 L38 634 L38 668 L3 660 Z" fill="#f0f0f0"/>
          <path d="M-3 626 L3 626 L3 660 L-3 660 Z" fill="#dcdcdc"/>
          <path d="M-32 642 h22 M-32 651 h22" stroke="#c9d6e2" stroke-width="2" stroke-linecap="round"/>
          <path d="M9 642 h22 M9 651 h22" stroke="#c9d6e2" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- 木木枭：在草地上来回走 -->
    <g class="rowlet-walk">
      <g transform="translate(286,712) scale(1.55)">
        <ellipse cx="0" cy="18" rx="17" ry="4.5" fill="#2f5c3a" opacity=".2"/>
        <g id="mascot" class="rowlet-art">
          <ellipse cx="0" cy="0" rx="17" ry="15.5" fill="#dcc39a" stroke="#cdb185" stroke-width="1"/>
          <ellipse cx="0" cy="4.5" rx="11" ry="9" fill="#fdf7e8"/>
          <g class="m-eyes">
            <circle cx="-6" cy="-3" r="5.2" fill="#2f2a28"/>
            <circle cx="6" cy="-3" r="5.2" fill="#2f2a28"/>
            <circle cx="-4.6" cy="-5" r="1.7" fill="#fff"/>
            <circle cx="7.4" cy="-5" r="1.7" fill="#fff"/>
          </g>
          <path d="M0 3 l3.2 2.8 -3.2 3 -3.2 -3z" fill="#eda45c"/>
          <circle cx="-12" cy="3" r="2.6" fill="#f5c0b8" opacity=".85"/>
          <circle cx="12" cy="3" r="2.6" fill="#f5c0b8" opacity=".85"/>
          <g class="m-leaf">
            <path d="M1 -14 C-3 -22 -12 -21 -13 -15 C-8 -12.5 -3 -12.8 1 -14 Z" fill="#7cc242" stroke="#5aa02f" stroke-width=".7"/>
            <path d="M1 -14 C5 -22 14 -21 15 -15 C10 -12.5 5 -12.8 1 -14 Z" fill="#93d35a" stroke="#5aa02f" stroke-width=".7"/>
          </g>
          <path d="M0 8.5 C-5 3.5 -10.5 5.5 -8.5 10.5 C-4.5 10.5 -2 9.5 0 9.5 Z" fill="#7cc242"/>
          <path d="M0 8.5 C5 3.5 10.5 5.5 8.5 10.5 C4.5 10.5 2 9.5 0 9.5 Z" fill="#93d35a"/>
        </g>
      </g>
    </g>
  </svg>
</div>
</body>
</html>
